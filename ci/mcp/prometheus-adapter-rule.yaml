rules:
  - seriesQuery: 'octo_mcp_exec_inflight{namespace!="",pod!=""}'
    resources:
      overrides:
        namespace: {resource: namespace}
        pod: {resource: pod}
    name:
      matches: '^octo_mcp_exec_inflight$'
      as: octo_mcp_exec_inflight
    metricsQuery: 'max(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
