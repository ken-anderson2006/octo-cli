---
apiVersion: cloud.tencent.com/v1alpha1
kind: TkeServiceConfig
metadata:
  name: octo-cli-mcp
  namespace: "{{NAMESPACE}}"
spec:
  loadBalancer:
    l7Listeners:
      - protocol: HTTPS
        port: 443
        domains:
          - domain: "{{PUBLIC_HOST}}"
            rules:
              - url: /mcp
                healthCheck:
                  enable: true
                  httpCheckPath: /readyz
                  httpCheckDomain: "{{PUBLIC_HOST}}"
                  httpCheckMethod: GET
                  httpCode: 2
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: octo-cli-mcp
  namespace: "{{NAMESPACE}}"
  annotations:
    kubernetes.io/ingress.class: qcloud
    kubernetes.io/ingress.existLbId: "{{INGRESS_CLB_ID}}"
    ingress.cloud.tencent.com/direct-access: "false"
    ingress.cloud.tencent.com/tke-service-config: octo-cli-mcp
spec:
  tls:
    - hosts:
        - "{{PUBLIC_HOST}}"
      secretName: "{{INGRESS_TLS_SECRET}}"
  rules:
    - host: "{{PUBLIC_HOST}}"
      http:
        paths:
          - path: /mcp
            pathType: ImplementationSpecific
            backend:
              service:
                name: octo-cli-mcp
                port:
                  number: 80
