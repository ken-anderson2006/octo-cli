# Add to the dmwork-test Web server block with its Kubernetes DNS resolver.
location = /mcp {
    set $octo_mcp_upstream octo-cli-mcp.dmwork-test.svc.cluster.local:80;
    proxy_pass http://$octo_mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_headers on;
    proxy_buffering off;
    proxy_read_timeout 150s;
}

location = /v1/skills {
    set $octo_mcp_upstream octo-cli-mcp.dmwork-test.svc.cluster.local:80;
    proxy_pass http://$octo_mcp_upstream;
}
